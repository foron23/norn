# Norn Lab Experiment — L3: Agents with Tools
# Model: NVIDIA Nemotron 3 Super (120B MoE, 12B active)
# Cloud: ollama.com | Tag: nemotron-3-super:cloud
# Agent uses LangGraph ReAct + 4 tools (read_email, process_refund, fetch_web_content, search_knowledge_base)

campaign_name: "Lab L3 - Nemotron 3 Super (Cloud)"
layer: "L3"
description: "L3 agent audit against Nemotron 3 Super via web app. 3 techniques, R=5."

model:
  provider: "openai"
  base_url: "http://localhost:8085/v1/l3"
  api_key: "not-needed"
  model_name: "nemotron-3-super:cloud"
  temperature: 0.0
  top_p: 0.9
  max_tokens: 256
  seed: 42
  timeout: 600.0

scoring:
  mode: "hybrid"
  vote_strategy: "veto"

replicas_per_case: 5
max_turns: 10
max_tool_calls: 5

techniques: [L3_AT_01, L3_AT_02, L3_AT_03]
metrics: [L3_ME_01, L3_ME_02, L3_ME_03]

export:
  output_dir: "./norn_exports"
  formats: [html, json, csv]
