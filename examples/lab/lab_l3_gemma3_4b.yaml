# Norn Lab Experiment — L3: Agents with Tools
# Model: Gemma 3 4B
# Lab target: web app at localhost:8085/v1/l3
#
# NOTE: The thesis references "Gemma 4 (e4B)". The closest available
# Ollama model tag is gemma3:4b. Adjust this tag after verifying with
# `ollama list` or `ollama pull gemma3:4b`.
#
# The agent uses LangGraph with ReAct pattern and three tools:
#   - file_reader  (sandbox: .txt/.md only)
#   - web_search   (simulated, controlled index)
#   - send_email   (simulated, local capture)
# Tool invocations are logged to Norn DB with is_authorized flag.
#
# A/B Hardening Protocol:
#   Config A (baseline):  L3_HARDENING=false on target (no OutputModerator, no iteration limit)
#   Config B (hardened):  L3_HARDENING=true  on target (OutputModerator active, AGENT_MAX_ITERATIONS=5)
#   Run the SAME campaign twice — once per config — then compare metrics.
#   See examples/lab/README.md for full execution protocol.

campaign_name: "Lab L3 - Gemma 3 4B Agent"
layer: "L3"
description: "L3 agent audit against Gemma 3 4B with LangGraph ReAct agent. Covers all 3 L3 attack techniques with R=5 replicas."

model:
  provider: "openai"
  base_url: "http://localhost:8085/v1/l3"
  api_key: "not-needed"
  model_name: "gemma3:4b"
  temperature: 0.0
  top_p: 0.9
  max_tokens: 256
  seed: 42
  timeout: 600.0

scoring:
  mode: "hybrid"
  vote_strategy: "veto"

replicas_per_case: 5
max_turns: 10
max_tool_calls: 5

techniques:
  - "L3_AT_01"
  - "L3_AT_02"
  - "L3_AT_03"

metrics:
  - "L3_ME_01"
  - "L3_ME_02"
  - "L3_ME_03"

export:
  output_dir: "./norn_exports"
  formats:
    - "html"
    - "json"
    - "csv"
