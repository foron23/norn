# Norn Lab Experiment — L1: LLM Standalone
# Model: Gemma 4 26B
# Lab target: web app at http://localhost:8085/v1/l1
#
# Gemma 4 26B MoE (17GB, 256K context). MoE with 128 experts.
# Uses the lab web app's OpenAI-compatible endpoint which proxies to Ollama.

campaign_name: "Lab L1 - Gemma 4 26B"
layer: "L1"
description: "L1 audit against Gemma 4 26B via web app endpoint. Covers all 10 L1 attack techniques with R=5 replicas."

model:
  provider: "openai"
  base_url: "http://localhost:8085/v1/l1"
  api_key: "not-needed"
  model_name: "gemma4:31b-cloud"
  temperature: 0.0
  top_p: 0.9
  max_tokens: 256
  seed: 42
  timeout: 600.0

scoring:
  mode: "hybrid"
  vote_strategy: "majority"

replicas_per_case: 5

techniques:
  - "L1_AT_01"
  - "L1_AT_02"
  - "L1_AT_03"
  - "L1_AT_04"
  - "L1_AT_05"
  - "L1_AT_06"
  - "L1_AT_07"
  - "L1_AT_08"
  - "L1_AT_09"
  - "L1_AT_10"

metrics:
  - "L1_ME_01"
  - "L1_ME_02"
  - "L1_ME_03"

export:
  output_dir: "./norn_exports"
  formats:
    - "html"
    - "json"
    - "csv"
