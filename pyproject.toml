[project]
name = "norn"
version = "0.1.0"
description = "Red teaming CLI framework for LLM applications - models, RAG, and agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Iker Foronda" }]
keywords = ["llm", "red-teaming", "security", "adversarial", "ollama", "rag", "agents", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "rich>=13.0",
    "tabulate>=0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
norn = "norn.cli.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["norn*"]

[tool.setuptools.package-data]
norn = ["corpus/**/*.json", "reports/templates/*.jinja2", "persistence/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
